{% extends "base.html" %}
{% block title %}Set New Password | Job Tracker{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="app-card">
        <h2 class="auth-title">Set a new password</h2>
        <p class="auth-subtitle">Choose a strong password for your account.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-brand w-100 mt-2">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}

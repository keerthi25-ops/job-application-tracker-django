{% extends "base.html" %}
{% block title %}Reset Password | Job Tracker{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="app-card">
        <h2 class="auth-title">Reset password</h2>
        <p class="auth-subtitle">Enter your email and we will send a reset link.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-brand w-100 mt-2">Send Reset Email</button>
        </form>

        <div class="mt-3">
            <a href="{% url 'login' %}">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #fffaf5;
            --bg-gradient: radial-gradient(circle at 8% 8%, #ffe0ea 0%, transparent 38%), radial-gradient(circle at 92% 20%, #fff2b8 0%, transparent 34%), radial-gradient(circle at 85% 85%, #d4f7f0 0%, transparent 36%);
            --text: #2a2440;
            --muted: #6d6585;
            --card: #ffffff;
            --brand: #ec4899;
            --brand-dark: #db2777;
            --border: #f0d7e7;
        }

        body.dark-theme {
            --bg: #1a1530;
            --bg-gradient: radial-gradient(circle at 8% 8%, #47325f 0%, transparent 35%), radial-gradient(circle at 92% 20%, #5a3f2a 0%, transparent 32%), radial-gradient(circle at 85% 85%, #1f4b46 0%, transparent 34%);
            --text: #f7f3ff;
            --muted: #c5bce2;
            --card: #261f3b;
            --brand: #f472b6;
            --brand-dark: #ec4899;
            --border: #4f3d67;
        }

        body {
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background: var(--bg);
            background-image: var(--bg-gradient);
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .topbar {
            background: linear-gradient(90deg, #d9468f 0%, #ec4899 45%, #f59e0b 100%);
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.25);
        }

        .brand-title {
            letter-spacing: 0.2px;
            font-weight: 800;
            color: #f8fafc;
            text-decoration: none;
        }

        .brand-title:hover {
            color: #fff7ed;
        }

        .welcome-text {
            color: #ffe7f5;
            font-size: 0.95rem;
        }

        .app-shell {
            max-width: 1100px;
            margin: 2rem auto;
        }

        .app-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(236, 72, 153, 0.12);
            padding: 1.5rem;
        }

        body.dark-theme .app-card,
        body.dark-theme .card,
        body.dark-theme .table,
        body.dark-theme .table-light th,
        body.dark-theme .alert {
            color: var(--text);
            background-color: #111827 !important;
            border-color: var(--border) !important;
        }

        body.dark-theme .table td,
        body.dark-theme .table th {
            border-color: var(--border);
        }

        body.dark-theme a {
            color: #f9a8d4;
        }

        body.dark-theme .text-secondary,
        body.dark-theme .welcome-text {
            color: var(--muted) !important;
        }

        .btn-brand {
            background-color: var(--brand);
            border-color: var(--brand);
            color: #fff;
            font-weight: 700;
        }

        .btn-brand:hover {
            background-color: var(--brand-dark);
            border-color: var(--brand-dark);
            color: #fff;
        }

        .form-label, label {
            font-weight: 600;
            color: #4b416a;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            margin-top: 0.35rem;
            margin-bottom: 0.9rem;
            background: #fff;
        }

        .butterfly-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .wing {
            position: absolute;
            width: 56px;
            height: 36px;
            opacity: 0.22;
            transform: rotate(-10deg);
            animation: drift 10s ease-in-out infinite;
        }

        .wing::before,
        .wing::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 36px;
            background: linear-gradient(180deg, #f472b6, #f59e0b);
            border-radius: 60% 40% 55% 45%;
        }

        .wing::before {
            left: 0;
            transform: rotate(-18deg);
        }

        .wing::after {
            right: 0;
            transform: scaleX(-1) rotate(-18deg);
        }

        .wing.one {
            top: 14%;
            left: 8%;
            animation-delay: 0s;
        }

        .wing.two {
            top: 24%;
            right: 11%;
            animation-delay: 1.4s;
        }

        .wing.three {
            bottom: 20%;
            left: 16%;
            animation-delay: 2.2s;
        }

        .wing.four {
            bottom: 10%;
            right: 18%;
            animation-delay: 3s;
        }

        @keyframes drift {
            0% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
            100% { transform: translateY(0) rotate(-8deg); }
        }

        .container.app-shell {
            position: relative;
            z-index: 1;
        }

        .auth-wrap {
            max-width: 520px;
            margin: 3.5rem auto;
        }

        .auth-title {
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        .auth-subtitle {
            color: var(--muted);
            margin-bottom: 1.25rem;
        }

        @media (max-width: 768px) {
            .app-shell {
                margin: 1rem;
            }

            .app-card {
                padding: 1rem;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
<div class="butterfly-layer" aria-hidden="true">
    <span class="wing one"></span>
    <span class="wing two"></span>
    <span class="wing three"></span>
    <span class="wing four"></span>
</div>
<nav class="navbar navbar-expand-lg topbar">
    <div class="container-fluid px-3 px-md-4">
        <a href="{% url 'home' %}" class="navbar-brand brand-title">Job Tracker</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <button id="themeToggle" type="button" class="btn btn-outline-light btn-sm">Dark</button>
            {% if request.user.is_authenticated %}
                <span class="welcome-text d-none d-sm-inline">Hello, {{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>
                <a href="{% url 'register' %}" class="btn btn-light btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container app-shell">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info shadow-sm border-0">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script>
    (function () {
        var key = "jobtracker-theme";
        var btn = document.getElementById("themeToggle");
        if (!btn) return;

        function setTheme(theme) {
            document.body.classList.toggle("dark-theme", theme === "dark");
            btn.textContent = theme === "dark" ? "Light" : "Dark";
        }

        var saved = localStorage.getItem(key);
        if (!saved) {
            saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        setTheme(saved);

        btn.addEventListener("click", function () {
            var next = document.body.classList.contains("dark-theme") ? "light" : "dark";
            localStorage.setItem(key, next);
            setTheme(next);
        });
    })();
</script>
</body>
</html>

{% extends "base.html" %}
{% block title %}Register | Job Tracker{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="app-card">
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle">Start tracking applications with a clean dashboard.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-brand w-100 mt-2">Register</button>
        </form>

        <div class="mt-3 d-flex flex-column gap-2">
            <span class="text-secondary">Already have an account? <a href="{% url 'login' %}">Login</a></span>
            <a href="{% url 'password_reset' %}">Forgot password?</a>
        </div>
    </div>
</div>
{% endblock %}

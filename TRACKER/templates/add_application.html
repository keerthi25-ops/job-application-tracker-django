
{% extends 'base.html' %}

{% block content %}

<h2>{{ page_title|default:"Add Job Application" }}</h2>

<form method="post" class="card p-4" enctype="multipart/form-data">
    {% csrf_token %}

    <h4>Company Details</h4>
    {{ company_form.as_p }}

    <h4>Job Details</h4>
    {{ job_form.as_p }}

    <h4>Resume Upload</h4>
    {{ resume_form.as_p }}

    <button type="submit" class="btn btn-primary">{{ submit_label|default:"Save" }}</button>
</form>

{% endblock %}
